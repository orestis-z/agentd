apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentd-egress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: agentd
  policyTypes:
  - Egress
  egress:
  # DNS resolution
  - ports:
    - protocol: UDP
      port: 53
  # HTTPS — Vertex AI + GitHub API
  - ports:
    - protocol: TCP
      port: 443
