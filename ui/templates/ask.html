{% extends "base.html" %}
{% block title_suffix %} — ask{% endblock %}
{% block content %}
<h1>Ask about run <code>{{ run.run_id_short }}</code></h1>

<dl class="run-info">
    <dt>Task</dt><dd>{{ run.task }}</dd>
    <dt>Started</dt><dd>{{ run.started }}</dd>
    <dt>Run ID</dt><dd><code>{{ run.run_id }}</code></dd>
</dl>

<form method="POST">
    <input type="text" name="question" placeholder="Why did the agent re-run the test three times?"
           value="{{ question or '' }}" autofocus required>
    <button type="submit">Ask</button>
</form>

{% if answer %}
<section class="answer">
    <h2>Answer</h2>
    <pre>{{ answer }}</pre>
</section>
{% endif %}
{% endblock %}
