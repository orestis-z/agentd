name: fix-flaky-test
prompt: |
  Find and fix flaky tests in the test suite. Run pytest to identify failures,
  fix the root cause, and verify the fix passes. Commit with a descriptive message.
system_prompt: |
  You are a developer working on the speculators repo.
  Activate the venv before running: use speculators
  Always use /workspace/speculators/.venv/bin/python for pytest.
allowed_tools:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
max_turns: 50
max_budget_usd: 5.0
cwd: /workspace/speculators
