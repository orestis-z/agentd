apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentd-orchestrator
  namespace: agentd-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentd-orchestrator-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: agentd-orchestrator
    namespace: agentd-ui
---
# Role in machine-learning: orchestrator provisions/tears down devenv GPU pods there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentd-orchestrator
  namespace: machine-learning
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentd-orchestrator
  namespace: machine-learning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentd-orchestrator
subjects:
  - kind: ServiceAccount
    name: agentd-orchestrator
    namespace: agentd-ui
