# ServiceAccount doubles as the OAuth client for oauth-proxy. The redirect-uri annotation
# registers the callback with the cluster OAuth server; the route host MUST match this exactly.
# The auth-delegator binding lets oauth-proxy create TokenReviews/SubjectAccessReviews.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentd-ui
  namespace: agentd-ui
  annotations:
    serviceaccounts.openshift.io/oauth-redirecturi.primary: "https://agentd-ui.apps.oc-nm-upstream-wdc.washington.nmopenshift.com/oauth/callback"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentd-ui-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: agentd-ui
    namespace: agentd-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentd-ui-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: agentd-ui
    namespace: agentd-ui
