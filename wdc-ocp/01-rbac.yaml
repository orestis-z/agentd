# ServiceAccount doubles as the OAuth client for oauth-proxy. The redirect-uri annotation
# registers the callback with the cluster OAuth server; the route host MUST match this exactly.
# The auth-delegator binding lets oauth-proxy create TokenReviews/SubjectAccessReviews.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentd-ui
  namespace: agentd
  annotations:
    serviceaccounts.openshift.io/oauth-redirecturi.primary: "https://agentd.apps.oc-nm-upstream-wdc.washington.nmopenshift.com/oauth/callback"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentd-ui-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: agentd-ui
    namespace: agentd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentd-ui-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: agentd-ui
    namespace: agentd
---
# Role in agentd namespace: UI manages secrets (API keys, webhooks) on behalf of users.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentd-ui-secrets
  namespace: agentd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentd-ui-secrets
  namespace: agentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentd-ui-secrets
subjects:
  - kind: ServiceAccount
    name: agentd-ui
    namespace: agentd
