# Pull secret for ghcr.io/orestis-z/agentd-ui (private image).
# Do NOT commit a real token here. apply.sh creates this secret from the
# GHCR_TOKEN env var: export GHCR_TOKEN=<github-pat-with-read:packages>
#
# To generate manually:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<github-pat> \
#     -n agentd
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: agentd
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKERCONFIG
