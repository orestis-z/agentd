name: Nightly Runner Image

on:
  schedule:
    - cron: "2 8 * * *"  # 08:02 UTC, ~45 min after devenv nightly build
  workflow_dispatch:

jobs:
  build-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: runner/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/agentd-runner:latest
