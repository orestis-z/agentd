[project]
name = "agentd"
version = "0.1.0"
description = "Headless AI agent runner for scheduled, unsupervised coding tasks"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "croniter",
    "flask",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
agentd = "agentd.runner:main"
agentd-orchestrate = "agentd.orchestrator:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["agentd"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
