[project]
name = "agentd"
version = "0.1.0"
description = "Headless AI agent runner for scheduled, unsupervised coding tasks"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "pyyaml",
]

[project.scripts]
agentd = "agentd.runner:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"
